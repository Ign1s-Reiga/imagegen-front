[package]
name = "imagegen-front"
version = "0.1.1"
description = "Desktop frontend for OpenAI, ComfyUI, RunPod, fal.ai, Replicate and A1111 image generation"
authors = []
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "imagegen_front_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
tauri-plugin-websocket = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
uuid = { version = "1.29.0", features = ["v4"] }
thiserror = "2.0.21"
